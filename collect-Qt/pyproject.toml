[project]
name = "emg-rehab-qt"
version = "0.1.0"
description = "EMG rehabilitation desktop collection application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bleak>=0.22",
    "fit-tool>=0.9.16",
    "Flask>=3.1,<4",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "PySide6-Addons>=6.8",
    "pymssql>=2.4.5,<3",
    "pyqtgraph>=0.13",
    "python-dotenv>=1.0,<2",
    "scipy>=1.14",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
