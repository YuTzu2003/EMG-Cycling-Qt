{% extends 'base.html' %}{% block title %}病人資料{% endblock %}{% block content %}
<div class="page-heading"><div class="eyebrow">PATIENT DIRECTORY</div><h1>病人資料</h1><p>新增資料後，Qt 收集程式可直接選擇同一位病人。</p></div>
<div class="row g-4"><div class="col-lg-5"><div class="surface form-panel"><h2>新增或更新病人</h2><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><div class="mb-3"><label class="form-label" for="patient_id">病人 ID</label><input class="form-control" id="patient_id" name="patient_id" maxlength="50" required></div><div class="mb-3"><label class="form-label" for="name">姓名</label><input class="form-control" id="name" name="name" maxlength="100" required></div><div class="mb-3"><label class="form-label" for="gender">性別</label><select class="form-select" id="gender" name="gender"><option>未指定</option><option>男性</option><option>女性</option><option>其他</option></select></div><div class="mb-4"><label class="form-label" for="notes">備註</label><textarea class="form-control" id="notes" name="notes" rows="3" maxlength="1000"></textarea></div><button class="btn btn-dark w-100">儲存病人</button></form></div></div><div class="col-lg-7"><div class="surface table-responsive"><table class="table align-middle mb-0"><thead><tr><th>ID</th><th>姓名</th><th>性別</th><th></th></tr></thead><tbody>{% for person in patients %}<tr><td>{{ person.patient_id }}</td><td><strong>{{ person.name }}</strong></td><td>{{ person.gender }}</td><td><a href="{{ url_for('portal.sessions', patient_id=person.patient_id) }}">查看測試</a></td></tr>{% else %}<tr><td colspan="4" class="empty">尚未建立病人。</td></tr>{% endfor %}</tbody></table></div></div></div>
{% endblock %}
