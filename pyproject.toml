[project]
name = "emg-rehab-core"
version = "0.1.0"
description = "EMG rehabilitation analysis, patient archive, and Flask portal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pymssql>=2.4.5,<3",
    "Flask>=3.1,<4",
    "python-dotenv>=1.0,<2",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]


