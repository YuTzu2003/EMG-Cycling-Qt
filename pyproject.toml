[project]
name = "emg-cycling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[project.scripts]
delsys = "delsys:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
